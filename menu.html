<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu — Annapurna Sweets</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>

        /* ─── Reset ─── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        /* ─── Page body — outer gold background ─── */
        body {
            min-height: 100vh;
            background: #c8922a;
            background-image:
                radial-gradient(ellipse at top,    #e0b050 0%, #c8922a 50%),
                radial-gradient(ellipse at bottom, #a0701a 0%, transparent 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 12px 48px;
            font-family: 'EB Garamond', Georgia, serif;
        }

        /* ─── Back button ─── */
        .back-btn {
            align-self: flex-start;
            margin-left: max(12px, calc(50% - 370px));
            margin-bottom: 14px;
            color: #fef3c7;
            font-size: 0.85rem;
            font-family: Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 1; }

        /* ─── Menu Card ─── */
        .menu-card {
            width: 100%;
            max-width: 740px;
            background: #fdf6ec;
            border: 5px solid #6b2a0e;
            position: relative;
            /* Outer double-border glow effect */
            box-shadow:
                0 0 0 8px #fdf6ec,
                0 0 0 12px #6b2a0e,
                0 0 40px rgba(0,0,0,0.35);
        }

        /* ─── Side Mandala Border Strips ─── */
        .side-border {
            position: absolute;
            top: 0; bottom: 0;
            width: 56px;
            z-index: 0;
            background-color: rgba(200,146,42,0.18);
            background-image:
                /* outer ring */
                radial-gradient(circle at 28px 28px, transparent 18px, rgba(107,42,14,0.25) 19px, rgba(107,42,14,0.25) 20px, transparent 21px),
                /* mid ring */
                radial-gradient(circle at 28px 28px, transparent 10px, rgba(107,42,14,0.2)  11px, rgba(107,42,14,0.2)  12px, transparent 13px),
                /* center dot */
                radial-gradient(circle at 28px 28px, rgba(107,42,14,0.45) 3px, transparent 4px),
                /* top petal */
                radial-gradient(ellipse 5px 9px at 28px 7px, rgba(107,42,14,0.3) 100%, transparent 100%),
                /* bottom petal */
                radial-gradient(ellipse 5px 9px at 28px 49px, rgba(107,42,14,0.3) 100%, transparent 100%),
                /* left petal */
                radial-gradient(ellipse 9px 5px at 7px 28px, rgba(107,42,14,0.3) 100%, transparent 100%),
                /* right petal */
                radial-gradient(ellipse 9px 5px at 49px 28px, rgba(107,42,14,0.3) 100%, transparent 100%),
                /* diagonal lines */
                linear-gradient(45deg, rgba(107,42,14,0.1) 1px, transparent 1px),
                linear-gradient(-45deg, rgba(107,42,14,0.1) 1px, transparent 1px);
            background-size:
                56px 56px,
                56px 56px,
                56px 56px,
                56px 56px,
                56px 56px,
                56px 56px,
                56px 56px,
                14px 14px,
                14px 14px;
        }
        .side-border-left  { left: 0;  border-right: 1.5px solid rgba(107,42,14,0.35); }
        .side-border-right { right: 0; border-left:  1.5px solid rgba(107,42,14,0.35); }

        /* ─── Inner content (clears the side borders) ─── */
        .card-inner {
            position: relative;
            z-index: 1;
            margin: 0 56px;
            padding-bottom: 32px;
        }

        /* ─── Top Mandala Ornament ─── */
        .top-ornament {
            display: flex;
            justify-content: center;
            padding: 22px 0 10px;
        }
        .top-ornament svg { display: block; }

        /* ─── MENU Title ─── */
        .menu-title-wrap {
            text-align: center;
            padding: 4px 24px 20px;
        }
        .menu-title-deco {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }
        .menu-title-deco::before,
        .menu-title-deco::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: linear-gradient(to right, transparent, #6b2a0e, transparent);
        }
        .menu-title-deco span {
            font-size: 0.7rem;
            color: #6b2a0e;
            font-family: Arial, sans-serif;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }
        .menu-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.8rem;
            font-weight: 700;
            color: #6b2a0e;
            letter-spacing: 0.08em;
            line-height: 1;
        }
        .menu-title-bottom {
            margin-top: 6px;
        }
        .menu-title-bottom::before,
        .menu-title-bottom::after {
            background: linear-gradient(to right, transparent, #6b2a0e, transparent);
        }

        /* ─── Section Header (dark brown rounded box) ─── */
        .section-header {
            background: #6b2a0e;
            color: #fef3c7;
            text-align: center;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin: 8px 0 6px;
        }

        /* ─── Menu items list ─── */
        .menu-items {
            width: 100%;
            padding: 6px 0 14px;
        }
        .menu-row {
            display: flex;
            align-items: baseline;
            padding: 9px 8px;
            border-bottom: 1px dashed rgba(107,42,14,0.2);
        }
        .menu-row:last-child { border-bottom: none; }
        .menu-row:nth-child(even) { background: rgba(200,146,42,0.06); }

        .row-num {
            font-size: 0.72rem;
            color: #bbb;
            min-width: 24px;
            font-family: Arial, sans-serif;
        }
        .row-name {
            flex: 1;
            font-size: 1.1rem;
            color: #5a2a0a;
            font-family: 'EB Garamond', Georgia, serif;
        }
        .row-name small {
            display: block;
            font-size: 0.78rem;
            color: #999;
            font-style: italic;
        }
        .row-price {
            min-width: 100px;
            text-align: right;
            font-size: 1rem;
            font-weight: 600;
            color: #6b2a0e;
            font-family: 'EB Garamond', Georgia, serif;
        }
        .row-price.na {
            color: #ccc;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            font-style: italic;
        }

        /* ─── Price Column Headers ─── */
        .col-headers {
            display: flex;
            align-items: center;
            padding: 4px 8px 2px;
        }
        .col-headers .ch-name { flex: 1; }
        .col-headers span {
            min-width: 100px;
            text-align: right;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(107,42,14,0.5);
            font-family: Arial, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ─── Empty State ─── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }
        .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .empty-state p { font-size: 0.9rem; font-family: Arial, sans-serif; }

        /* ─── Bottom Ornament ─── */
        .bottom-ornament {
            display: flex;
            justify-content: center;
            padding: 18px 0 24px;
        }

        /* ─── Footer note ─── */
        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(107,42,14,0.5);
            font-family: Arial, sans-serif;
            letter-spacing: 0.08em;
            padding: 0 0 10px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .card-inner { margin: 0 44px; }
            .side-border { width: 44px; }
            .menu-title { font-size: 2.8rem; }
            .row-price { min-width: 80px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592; Back to Store</a>

    <div class="menu-card">

        <!-- Left mandala border -->
        <div class="side-border side-border-left"></div>
        <!-- Right mandala border -->
        <div class="side-border side-border-right"></div>

        <div class="card-inner">

            <!-- Top Mandala Ornament -->
            <div class="top-ornament">
                <svg width="180" height="90" viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg">
                    <!-- Mandala centered at 90,78 (partially visible) -->
                    <g transform="translate(90,78)" fill="none" stroke="#6b2a0e">
                        <circle r="70" stroke-width="1" opacity="0.25"/>
                        <circle r="56" stroke-width="1" opacity="0.3"/>
                        <circle r="42" stroke-width="1" opacity="0.35"/>
                        <circle r="28" stroke-width="1.2" opacity="0.4"/>
                        <circle r="14" stroke-width="1.2" opacity="0.5"/>
                        <circle r="5" fill="#6b2a0e" opacity="0.6" stroke="none"/>
                        <!-- 8 spokes -->
                        <line x1="0" y1="-70" x2="0" y2="70" stroke-width="0.6" opacity="0.25"/>
                        <line x1="-70" y1="0" x2="70" y2="0" stroke-width="0.6" opacity="0.25"/>
                        <line x1="-49.5" y1="-49.5" x2="49.5" y2="49.5" stroke-width="0.6" opacity="0.2"/>
                        <line x1="49.5" y1="-49.5" x2="-49.5" y2="49.5" stroke-width="0.6" opacity="0.2"/>
                        <!-- Petals at top (visible part) -->
                        <ellipse cx="0" cy="-56" rx="7" ry="14" fill="#6b2a0e" opacity="0.2" stroke="none"/>
                        <ellipse cx="-40" cy="-40" rx="7" ry="14" transform="rotate(45)" fill="#6b2a0e" opacity="0.15" stroke="none"/>
                        <ellipse cx="40" cy="-40" rx="7" ry="14" transform="rotate(-45)" fill="#6b2a0e" opacity="0.15" stroke="none"/>
                        <ellipse cx="-56" cy="0" rx="14" ry="7" fill="#6b2a0e" opacity="0.18" stroke="none"/>
                        <ellipse cx="56" cy="0" rx="14" ry="7" fill="#6b2a0e" opacity="0.18" stroke="none"/>
                        <!-- Outer petal dots -->
                        <circle cx="0" cy="-70" r="4" fill="#c8922a" opacity="0.7" stroke="none"/>
                        <circle cx="-49.5" cy="-49.5" r="3" fill="#c8922a" opacity="0.5" stroke="none"/>
                        <circle cx="49.5" cy="-49.5" r="3" fill="#c8922a" opacity="0.5" stroke="none"/>
                        <circle cx="-70" cy="0" r="3" fill="#c8922a" opacity="0.4" stroke="none"/>
                        <circle cx="70" cy="0" r="3" fill="#c8922a" opacity="0.4" stroke="none"/>
                    </g>
                    <!-- Horizontal decorative lines at top -->
                    <line x1="20" y1="6" x2="160" y2="6" stroke="#6b2a0e" stroke-width="0.8" opacity="0.4"/>
                    <line x1="30" y1="10" x2="150" y2="10" stroke="#6b2a0e" stroke-width="0.5" opacity="0.25"/>
                </svg>
            </div>

            <!-- MENU Title -->
            <div class="menu-title-wrap">
                <div class="menu-title-deco"><span>✦</span></div>
                <h1 class="menu-title" id="page-title">MENU</h1>
                <div class="menu-title-deco menu-title-bottom"><span>✦</span></div>
            </div>

            <!-- Menu Content populated by JS -->
            <div id="menu-content"></div>

            <!-- Bottom Ornament -->
            <div class="bottom-ornament">
                <svg width="140" height="30" viewBox="0 0 140 30" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="15" x2="55" y2="15" stroke="#6b2a0e" stroke-width="1" opacity="0.35"/>
                    <line x1="85" y1="15" x2="140" y2="15" stroke="#6b2a0e" stroke-width="1" opacity="0.35"/>
                    <circle cx="70" cy="15" r="10" fill="none" stroke="#6b2a0e" stroke-width="1" opacity="0.45"/>
                    <circle cx="70" cy="15" r="5" fill="none" stroke="#6b2a0e" stroke-width="1" opacity="0.45"/>
                    <circle cx="70" cy="15" r="2" fill="#6b2a0e" opacity="0.55"/>
                    <circle cx="57" cy="15" r="3" fill="#6b2a0e" opacity="0.3"/>
                    <circle cx="83" cy="15" r="3" fill="#6b2a0e" opacity="0.3"/>
                    <line x1="70" y1="5" x2="70" y2="25" stroke="#6b2a0e" stroke-width="0.7" opacity="0.3"/>
                </svg>
            </div>

            <!-- Footer -->
            <p class="footer-note">All prices in &#8377; Indian Rupees &nbsp;&#8226;&nbsp; Prices subject to change</p>

        </div><!-- end .card-inner -->
    </div><!-- end .menu-card -->

<script>
    // =============================================
    // Menu Page — reads from localStorage
    // =============================================
    var STORAGE_KEY = 'annapurna_products';

    var CONFIG = {
        Sweets:  { title: 'SWEETS MENU',  header: '&#127852; Sweets',  col2: 'Price&nbsp;/&nbsp;Pc', col3: 'Price&nbsp;/&nbsp;kg' },
        Snack:   { title: 'SNACKS MENU',  header: '&#127840; Snacks',  col2: 'Price&nbsp;/&nbsp;Pc', col3: 'Price&nbsp;/&nbsp;Plt' },
        Grocery: { title: 'GROCERY MENU', header: '&#128717; Grocery', col2: 'Price&nbsp;/&nbsp;Pc', col3: 'Price&nbsp;/&nbsp;kg' }
    };

    var params = new URLSearchParams(window.location.search);
    var cat = params.get('cat') || 'Sweets';
    var cfg = CONFIG[cat] || CONFIG['Sweets'];

    // Set browser tab title
    document.title = cfg.title + ' — Annapurna Sweets';

    // Load products from localStorage
    var allProducts = [];
    try { allProducts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}
    var items = allProducts.filter(function(p) { return p.category === cat; });

    var contentEl = document.getElementById('menu-content');

    if (items.length === 0) {
        contentEl.innerHTML =
            '<div class="section-header">' + cfg.header + '</div>' +
            '<div class="empty-state">' +
                '<div class="e-icon">&#127860;</div>' +
                '<p>No items have been added yet.<br>Check back soon!</p>' +
            '</div>';
    } else {
        // Column headers row
        var colHeaders =
            '<div class="col-headers">' +
                '<span class="ch-name"></span>' +
                '<span>' + cfg.col2 + '</span>' +
                '<span>' + cfg.col3 + '</span>' +
            '</div>';

        // Item rows
        var rows = items.map(function(p, i) {
            var pc  = p.pricePerPc || p.price || '';
            var sec = p.pricePerKg || '';

            var pcCell  = pc  ? '<span class="row-price">&#8377;&nbsp;' + pc  + '</span>'
                              : '<span class="row-price na">&mdash;&mdash;&mdash;&mdash;</span>';
            var secCell = sec ? '<span class="row-price">&#8377;&nbsp;' + sec + '</span>'
                              : '<span class="row-price na">&mdash;&mdash;&mdash;&mdash;</span>';

            var descHtml = p.description ? '<small>' + p.description + '</small>' : '';

            return '<div class="menu-row">' +
                '<span class="row-num">' + (i + 1) + '</span>' +
                '<span class="row-name">' + p.name + descHtml + '</span>' +
                pcCell +
                secCell +
            '</div>';
        }).join('');

        contentEl.innerHTML =
            '<div class="section-header">' + cfg.header + '</div>' +
            colHeaders +
            '<div class="menu-items">' + rows + '</div>';
    }
</script>

</body>
</html>
