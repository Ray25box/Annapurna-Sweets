<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Annapurna Sweets</title>
    <link rel="stylesheet" href="style.css">
    <script src="sheets.js"></script>
</head>
<body>

    <!-- OUTER DECORATIVE FRAME -->
    <div class="page-frame">

        <!-- TOP HEADER: Logo + Icons -->
        <header class="top-header">
            <div class="header-icons left-icons">
                <button class="icon-btn">&#128269;</button>
            </div>

            <div class="logo-center">
                <img src="logo.jpg" alt="AS Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
                <div id="logo-fallback" class="logo-fallback">AS</div>
                <h1 class="brand-name">ANNAPURNA SWEETS</h1>
                <p class="brand-tagline">Authentic Bengali Sweets</p>
            </div>

            <div class="header-icons right-icons">
                <button class="icon-btn">&#128100;</button>
                <button class="icon-btn cart-btn">
                    &#128722;
                    <span class="cart-badge">1</span>
                </button>
            </div>
        </header>

        <!-- NAVIGATION BAR -->
        <nav class="main-nav">
            <button id="hamburger-btn" class="hamburger-btn">&#9776; MENU</button>
            <div class="nav-links" id="nav-links">
                <a href="index.html">HOME</a>
                <span class="divider">|</span>
                <a href="#">ABOUT</a>
                <span class="divider">|</span>
                <div class="dropdown">
                    <a href="javascript:void(0)">PRODUCTS &#9660;</a>
                    <div class="dropdown-menu">
                        <a href="menu.html?cat=Sweets">&#127852; Sweets</a>
                        <a href="menu.html?cat=Snack">&#127840; Snacks</a>
                        <a href="menu.html?cat=Grocery">&#128717; Grocery</a>
                    </div>
                </div>
                <span class="divider">|</span>
                <a href="gallery.html" style="color:var(--gold); border-bottom:1px solid var(--gold);">GALLERY</a>
                <span class="divider">|</span>
                <a href="index.html#order-section">CONTACT</a>
            </div>
        </nav>

        <!-- GALLERY SECTION -->
        <section class="catalog" style="padding-top: 40px; padding-bottom: 60px;">
            <h2 class="catalog-title">PHOTO GALLERY</h2>
            <p style="text-align: center; color: var(--text-brown); margin-bottom: 20px; font-style: italic;">
                A visual showcase of all our authentic delicacies.
            </p>

            <div id="full-gallery-container" style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
                <!-- Dynamically loaded by JavaScript -->
            </div>
            
            <script>
                document.addEventListener('DOMContentLoaded', async function() {
                    const container = document.getElementById('full-gallery-container');
                    container.innerHTML = '<p style="text-align:center;color:#8b3a1a;padding:40px;">Loading gallery…</p>';

                    const allProducts = await fetchSheet('Products');
                    const galleryProducts = allProducts.filter(function(p) { return p.ImageURL; });

                    if (galleryProducts.length === 0) {
                        container.innerHTML = '<p style="text-align:center;color:#8b3a1a;padding:40px;font-style:italic;">No images available yet.</p>';
                        return;
                    }

                    // Build an ordered category list (known ones first, custom ones after)
                    var knownOrder = ['Sweets', 'Snack', 'Grocery'];
                    var allCats = [];
                    allProducts.forEach(function(p) {
                        if (p.Category && allCats.indexOf(p.Category) === -1) allCats.push(p.Category);
                    });
                    var orderedCats = knownOrder.filter(function(c) { return allCats.indexOf(c) !== -1; });
                    allCats.forEach(function(c) { if (orderedCats.indexOf(c) === -1) orderedCats.push(c); });

                    var html = '';
                    orderedCats.forEach(function(catName) {
                        var items = galleryProducts.filter(function(p) { return p.Category === catName; });
                        if (items.length === 0) return;
                        var displayName = catName === 'Snack' ? 'Snacks' : catName;
                        html += '<h3 style="text-align:center;color:#6b2a0e;margin:40px 0 20px;font-family:\'Playfair Display\',serif;font-size:1.8rem;border-bottom:2px solid #e8d5b0;padding-bottom:10px;">' + displayName + '</h3>';
                        html += '<div class="product-grid">';
                        items.forEach(function(p) {
                            var desc = p.Description || p.Category;
                            html += '<div class="product-card">' +
                                '<div class="product-img"><img src="' + driveImg(p.ImageURL) + '" alt="' + p.Name + '" onerror="driveImgFallback(this)"></div>' +
                                '<h3>' + p.Name.toUpperCase() + '</h3>' +
                                '<p>' + desc + '</p>' +
                            '</div>';
                        });
                        html += '</div>';
                    });

                    container.innerHTML = html;
                });
            </script>
        </section>

    </div><!-- end .page-frame -->

    <!-- Mobile Menu Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger-btn');
            const navLinks = document.getElementById('nav-links');
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
        });
    </script>
</body>
</html>
